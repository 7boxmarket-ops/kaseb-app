
name: Build Kaseb Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -type f -iname '*.zip' \
            -not -path './.git/*' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP found in repository."
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully."
          find extracted -maxdepth 3 -type f | head -n 100

      - name: Locate Android Gradle project
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE="$(find extracted -type f \
            -name gradlew -print -quit)"

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: No Gradle wrapper found."
            echo "The ZIP may be a web project, not a complete Android project."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLE_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Make Gradle wrapper executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build debug APK
        working-directory: .
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kaseb-Android-APK
          path: extracted/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
