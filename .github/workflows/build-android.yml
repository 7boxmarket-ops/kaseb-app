
name: Build Kaseb Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Signed Kaseb APK
    runs-on: ubuntu-latest

    steps:
      # 1. دریافت مخزن
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. استخراج ZIP اصلی پروژه
      - name: Extract Kaseb project
        shell: bash
        run: |
          set -euo pipefail

          WORK="$GITHUB_WORKSPACE"
          TEMP="$RUNNER_TEMP/kaseb-extracted"
          ARCHIVE="$WORK/kaseb-github-release-project-2.zip"

          echo "Repository files:"
          find "$WORK" -maxdepth 3 -type f \
            ! -path '*/.git/*' | sort

          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::Project ZIP not found: $ARCHIVE"
            exit 1
          fi

          mkdir -p "$TEMP"

          echo "Extracting project ZIP..."
          unzip -oq "$ARCHIVE" -d "$TEMP"

          PROJECT_ROOT=""

          while IFS= read -r -d '' file; do
            candidate="$(dirname "$file")"

            if [ -f "$candidate/capacitor.config.json" ] &&
               [ -f "$candidate/package.json" ] &&
               [ -d "$candidate/resources/android" ] &&
               [ -f "$candidate/resources/native/MainActivity.java" ]; then
              PROJECT_ROOT="$candidate"
              break
            fi
          done < <(find "$TEMP" -type f -name package.json -print0)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::Could not find Kaseb project root inside ZIP."
            find "$TEMP" -maxdepth 6 -type f | sort
            exit 1
          fi

          echo "Project root: $PROJECT_ROOT"

          # انتقال محتوای پروژه به ریشه مخزن
          cp -a "$PROJECT_ROOT"/. "$WORK"/

          # استخراج HTML اصلی برنامه
          if [ -f "$WORK/source/kaseb-source.zip" ]; then
            mkdir -p "$RUNNER_TEMP/kaseb-source"

            unzip -oq "$WORK/source/kaseb-source.zip" \
              -d "$RUNNER_TEMP/kaseb-source"

            if [ ! -s "$RUNNER_TEMP/kaseb-source/index.html" ]; then
              echo "::error::index.html missing inside source ZIP."
              exit 1
            fi

            cp "$RUNNER_TEMP/kaseb-source/index.html" \
              "$WORK/index.html"

          elif [ -s "$WORK/index.html" ]; then
            echo "Using project index.html."

          else
            echo "::error::Kaseb index.html was not found."
            exit 1
          fi

          # بررسی فایل‌های ضروری
          test -s "$WORK/index.html"
          test -f "$WORK/package.json"
          test -f "$WORK/capacitor.config.json"
          test -d "$WORK/resources/android"
          test -f "$WORK/resources/native/MainActivity.java"

          echo "Kaseb project extracted successfully."

      # 3. نصب Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 4. نصب Java 21
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 5. نصب وابستگی‌ها و ساخت پروژه Android
      - name: Install dependencies and prepare Android
        shell: bash
        run: |
          set -euo pipefail

          npm install

          mkdir -p www
          cp index.html www/index.html

          npx cap add android
          npx cap sync android

          test -f android/gradlew
          test -f android/app/build.gradle

          echo "Android project prepared."

      # 6. اعمال آیکون و تنظیمات بومی
      - name: Apply Kaseb native configuration
        shell: bash
        run: |
          set -euo pipefail

          RES="android/app/src/main/res"
          JAVA_DIR="android/app/src/main/java/com/sevenbox/kaseb"

          # آیکون برنامه
          find "$RES" -name 'ic_launcher*' -type f -delete
          cp -r resources/android/. "$RES"/

          # صفحه شروع
          find "$RES" -name 'splash*' -type f -delete

          mkdir -p "$RES/drawable"

          cat > "$RES/drawable/splash.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <color android:color="#FF7A1A"/>
              </item>
          </layer-list>
          XML

          # پل بومی چاپ و پشتیبان‌گیری
          mkdir -p "$JAVA_DIR"

          cp resources/native/MainActivity.java \
            "$JAVA_DIR/MainActivity.java"

          # مجوز میکروفون و سرویس تشخیص گفتار
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")

          permission = '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'

          if "android.permission.RECORD_AUDIO" not in s:
              s = s.replace("<application", permission + "<application", 1)

          if "android.speech.RecognitionService" not in s:
              queries = """
              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>
              """

              s = s.replace("<application", queries + "\n<application", 1)

          p.write_text(s, encoding="utf-8")
          print("AndroidManifest.xml updated.")
          PY

          echo "Native configuration applied."

      # 7. بررسی تنظیمات پروژه
      - name: Verify Kaseb configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png

          grep -q 'android.permission.RECORD_AUDIO' \
            android/app/src/main/AndroidManifest.xml

          grep -q 'KasebNative' \
            android/app/src/main/java/com/sevenbox/kaseb/MainActivity.java

          grep -rqi 'speech-recognition' android

          echo "Kaseb configuration verified."

      # 8. تنظیم امضای Release
      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ] ||
             [ -z "${KEYSTORE_PASSWORD:-}" ] ||
             [ -z "${KEY_ALIAS:-}" ] ||
             [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Release signing secrets are incomplete."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/kaseb-release.jks"

          test -s "$RUNNER_TEMP/kaseb-release.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/kaseb-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text(encoding="utf-8")

          if "signingConfigs {" not in s:
              signing = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_PATH"))
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              """

              s, count = re.subn(
                  r'(?m)^\\s*buildTypes\\s*\\{',
                  signing + "buildTypes {",
                  s,
                  count=1
              )

              if count != 1:
                  raise SystemExit("Could not find buildTypes block.")

          pattern = r'(buildTypes\\s*\\{\\s*release\\s*\\{)'

          if not re.search(
              r'release\\s*\\{[^}]*signingConfig\\s+signingConfigs\\.release',
              s,
              re.S
          ):
              s, count = re.subn(
                  pattern,
                  r'\\1\n            signingConfig signingConfigs.release',
                  s,
                  count=1
              )

              if count != 1:
                  raise SystemExit("Could not configure release signing.")

          p.write_text(s, encoding="utf-8")
          print("Release signing configured.")
          PY

      # 9. ساخت APK امضاشده
      - name: Build signed release APK
        shell: bash
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/kaseb-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd android

          chmod +x gradlew

          ./gradlew --no-daemon assembleRelease

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          echo "Release APK generated."

      # 10. بررسی امضای APK
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"

          apksigner verify --verbose "$APK"

          echo "APK signature verified."

      # 11. دریافت APK از بخش Artifacts
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: kaseb-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # 12. انتشار APK در GitHub Release هنگام ساخت Tag
      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
