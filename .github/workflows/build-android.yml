
name: Kaseb Android Release APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Locate and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted

          ZIP_PATH="$(find . -type f -iname '*.zip' \
            ! -path './.git/*' \
            ! -path './extracted/*' \
            -print -quit)"

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::No project ZIP found in the repository."
            exit 1
          fi

          echo "Found project ZIP: $ZIP_PATH"
          unzip -q "$ZIP_PATH" -d extracted

          GRADLEW="$(find extracted -type f -name gradlew \
            -not -path '*/node_modules/*' \
            -print -quit)"

          if [ -n "$GRADLEW" ]; then
            PROJECT_DIR="$(cd "$(dirname "$GRADLEW")" && pwd)"
            echo "Detected an existing Android/Gradle project."
          else
            INDEX_HTML="$(find extracted -type f -name index.html \
              -not -path '*/node_modules/*' \
              -not -path '*/.git/*' \
              -print -quit)"

            if [ -z "$INDEX_HTML" ]; then
              echo "::error::Neither gradlew nor index.html was found in the ZIP."
              exit 1
            fi

            WEB_DIR="$(cd "$(dirname "$INDEX_HTML")" && pwd)"
            echo "Detected a web application. Creating an Android wrapper."

            mkdir -p android-wrapper/www
            cp -a "$WEB_DIR"/. android-wrapper/www/

            cd android-wrapper
            npm init -y
            npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

            npx cap init "کاسب" com.sevenbox.kaseb --web-dir=www
            npx cap add android

            PROJECT_DIR="$GITHUB_WORKSPACE/android-wrapper/android"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::Android SDK directory was not found."
            exit 1
          fi

          echo "Android SDK: $ANDROID_HOME"
          echo "Installed platforms:"
          ls -1 "$ANDROID_HOME/platforms" 2>/dev/null || true

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found."
            exit 1
          fi

          if [ ! -d "$ANDROID_HOME/platforms/android-34" ] || \
             [ ! -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
            echo "Required Android SDK packages are missing."
            echo "Installing Android 34 platform and Build Tools 34.0.0."

            "$SDKMANAGER" --install \
              "platform-tools" \
              "platforms;android-34" \
              "build-tools;34.0.0"
          else
            echo "Required Android SDK packages are already installed."
          fi

      - name: Configure existing release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ] || \
             [ -z "$KEYSTORE_PASSWORD" ] || \
             [ -z "$KEY_ALIAS" ] || \
             [ -z "$KEY_PASSWORD" ]; then
            echo "::error::One or more signing secrets are missing."
            echo "Check KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/kaseb-release.jks"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::The decoded keystore is empty."
            exit 1
          fi

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            >/dev/null

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "Existing release keystore validated."

      - name: Build signed Release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"
          chmod +x ./gradlew

          ./gradlew --no-daemon --stacktrace assembleRelease \
            "-Pandroid.injected.signing.store.file=$KEYSTORE_PATH" \
            "-Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$KEY_PASSWORD"

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/release/*.apk' \
            -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK was not found after the build."
            echo "Searching for available APK files:"
            find "$PROJECT_DIR" -type f -name '*.apk' -print || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/apk-output/Kaseb-Release.apk"

          echo "APK collected successfully."
          ls -lh "$GITHUB_WORKSPACE/apk-output/Kaseb-Release.apk"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Kaseb-Android-Release
          path: apk-output/Kaseb-Release.apk
          if-no-files-found: error
          retention-days: 30
