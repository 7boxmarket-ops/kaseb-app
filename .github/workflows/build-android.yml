
name: Build Kaseb Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Signed Kaseb APK
    runs-on: ubuntu-latest

    steps:
      # 1. دریافت مخزن
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. استخراج ZIP اصلی و پیدا کردن ریشه واقعی پروژه
      - name: Extract and prepare Kaseb project
        shell: bash
        run: |
          set -euo pipefail

          WORK="$GITHUB_WORKSPACE"
          TEMP="$RUNNER_TEMP/kaseb-extracted"

          mkdir -p "$TEMP"

          echo "Repository files:"
          find "$WORK" -maxdepth 3 -type f \
            ! -path '*/.git/*' | sort

          ARCHIVE="$WORK/kaseb-app-release-project.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::kaseb-app-release-project.zip was not found in repository root."
            exit 1
          fi

          echo "Extracting project archive..."
          unzip -oq "$ARCHIVE" -d "$TEMP"

          echo "Searching for project root..."

          PROJECT_ROOT=""

          while IFS= read -r -d '' file; do
            candidate="$(dirname "$file")"

            if [ -f "$candidate/capacitor.config.json" ] &&
               [ -f "$candidate/package.json" ] &&
               [ -d "$candidate/resources/android" ] &&
               [ -f "$candidate/resources/native/MainActivity.java" ]; then

              PROJECT_ROOT="$candidate"
              break
            fi
          done < <(find "$TEMP" -type f -name package.json -print0)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::Kaseb project root not found inside archive."
            echo "Extracted files:"
            find "$TEMP" -maxdepth 6 -type f | sort
            exit 1
          fi

          echo "Project root: $PROJECT_ROOT"

          # انتقال محتوای پروژه به ریشه workspace
          cp -a "$PROJECT_ROOT"/. "$WORK"/

          # بررسی سورس اصلی
          if [ -f "$WORK/source/kaseb-source.zip" ]; then
            mkdir -p "$RUNNER_TEMP/kaseb-source"
            unzip -oq "$WORK/source/kaseb-source.zip" \
              -d "$RUNNER_TEMP/kaseb-source"

            if [ ! -s "$RUNNER_TEMP/kaseb-source/index.html" ]; then
              echo "::error::index.html is missing inside source ZIP."
              exit 1
            fi

            cp "$RUNNER_TEMP/kaseb-source/index.html" "$WORK/index.html"

          elif [ -s "$WORK/index.html" ]; then
            echo "Using existing index.html."

          else
            echo "::error::Neither source ZIP nor index.html exists."
            exit 1
          fi

          # بررسی نهایی فایل‌های ضروری
          test -s "$WORK/index.html"
          test -f "$WORK/package.json"
          test -f "$WORK/capacitor.config.json"
          test -d "$WORK/resources/android"
          test -f "$WORK/resources/native/MainActivity.java"

          echo "Kaseb project prepared successfully."

      # 3. نصب Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 4. نصب Java 21
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 5. نصب وابستگی‌ها و ساخت پروژه اندروید
      - name: Install dependencies and prepare Android
        shell: bash
        run: |
          set -euo pipefail

          npm install

          mkdir -p www
          cp index.html www/index.html

          # ساخت پروژه اندروید Capacitor
          rm -rf android
          npx cap add android
          npx cap sync android

          test -f android/gradlew
          test -f android/app/build.gradle

          echo "Android project generated successfully."

      # 6. اعمال آیکون، پل بومی و مجوز میکروفون
      - name: Apply Kaseb native configuration
        shell: bash
        run: |
          set -euo pipefail

          RES="android/app/src/main/res"
          JAVA_DIR="android/app/src/main/java/com/sevenbox/kaseb"

          # آیکون برنامه
          find "$RES" -name 'ic_launcher*' -type f -delete
          cp -r resources/android/. "$RES"/

          # صفحه شروع
          find "$RES" -name 'splash*' -type f -delete

          mkdir -p "$RES/drawable"

          cat > "$RES/drawable/splash.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <color android:color="#FF7A1A"/>
              </item>
          </layer-list>
          XML

          # پل بومی چاپ و پشتیبان‌گیری
          mkdir -p "$JAVA_DIR"

          cp resources/native/MainActivity.java \
            "$JAVA_DIR/MainActivity.java"

          # مجوز میکروفون و دسترسی سرویس تشخیص گفتار
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")

          if "android.permission.RECORD_AUDIO" not in content:
              content = content.replace(
                  "<application",
                  '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
                  "<application",
                  1
              )

          if "android.speech.RecognitionService" not in content:
              queries = """
              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>
              """

              if "<application" in content:
                  content = content.replace(
                      "<application",
                      queries + "\n    <application",
                      1
                  )
              else:
                  raise SystemExit("Manifest application tag not found.")

          manifest.write_text(content, encoding="utf-8")
          print("Manifest updated.")
          PY

          echo "Native configuration applied."

      # 7. بررسی تنظیمات
      - name: Verify Kaseb configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png

          grep -q 'android.permission.RECORD_AUDIO' \
            android/app/src/main/AndroidManifest.xml

          grep -q 'KasebNative' \
            android/app/src/main/java/com/sevenbox/kaseb/MainActivity.java

          grep -rqi 'speech-recognition' android

          echo "Kaseb configuration verified."

      # 8. تنظیم امضای نسخه Release
      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ] ||
             [ -z "${KEYSTORE_PASSWORD:-}" ] ||
             [ -z "${KEY_ALIAS:-}" ] ||
             [ -z "${KEY_PASSWORD:-}" ]; then

            echo "::error::Release signing secrets are incomplete."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/kaseb-release.jks"

          test -s "$RUNNER_TEMP/kaseb-release.jks"

          # بررسی معتبر بودن فایل کلید
          keytool -list \
            -keystore "$RUNNER_TEMP/kaseb-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle")
          content = gradle.read_text(encoding="utf-8")

          if "signingConfigs {" not in content:
              signing = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_PATH"))
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              """

              content, count = re.subn(
                  r'(?m)^\\s*buildTypes\\s*\\{',
                  signing + "buildTypes {",
                  content,
                  count=1
              )

              if count != 1:
                  raise SystemExit("Could not locate buildTypes block.")

          if not re.search(
              r'buildTypes\\s*\\{\\s*release\\s*\\{[^}]*signingConfig',
              content,
              re.S
          ):
              pattern = r'(buildTypes\\s*\\{\\s*release\\s*\\{)'

              content, count = re.subn(
                  pattern,
                  r'\\1\n            signingConfig signingConfigs.release',
                  content,
                  count=1
              )

              if count != 1:
                  raise SystemExit("Could not attach release signing config.")

          gradle.write_text(content, encoding="utf-8")
          print("Release signing configured.")
          PY

      # 9. ساخت APK امضاشده
      - name: Build signed release APK
        shell: bash
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/kaseb-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd android

          chmod +x gradlew

          ./gradlew --no-daemon assembleRelease

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          echo "APK generated successfully."

      # 10. بارگذاری APK
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: kaseb-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # 11. پیوست APK به GitHub Release در صورت ساخت Tag
      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
