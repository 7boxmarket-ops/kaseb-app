
name: Build Kaseb Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Locate and extract project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1 || true)"

          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting: $ZIP_FILE"
            mkdir -p extracted
            unzip -q "$ZIP_FILE" -d extracted
            SEARCH_ROOT="extracted"
          else
            SEARCH_ROOT="."
          fi

          GRADLE_FILE="$(find "$SEARCH_ROOT" -type f -name gradlew | head -n 1 || true)"

          if [ -n "$GRADLE_FILE" ]; then
            PROJECT_DIR="$(dirname "$GRADLE_FILE")"
          else
            INDEX_FILE="$(find "$SEARCH_ROOT" -type f -name index.html | head -n 1 || true)"

            if [ -z "$INDEX_FILE" ]; then
              echo "ERROR: Neither gradlew nor index.html was found."
              exit 1
            fi

            WEB_DIR="$(dirname "$INDEX_FILE")"
            mkdir -p android-wrapper/www
            cp -a "$WEB_DIR"/. android-wrapper/www/

            cd android-wrapper

            npm init -y
            npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

            npx cap init "کاسب" com.sevenbox.kaseb --web-dir=www
            npx cap add android

            cd ..

            PROJECT_DIR="android-wrapper/android"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Configure launcher icons
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="$PROJECT_DIR/app"

          if [ ! -d "$APP_DIR" ]; then
            echo "ERROR: Android app directory not found: $APP_DIR"
            exit 1
          fi

          RES="$APP_DIR/src/main/res"
          mkdir -p "$RES"

          python3 -m pip install --quiet pillow

          ICON_SOURCE=""

          for candidate in \
            "1000170973.png" \
            "icon.png" \
            "logo.png" \
            "app-icon.png" \
            "app_icon.png"
          do
            FOUND="$(find . -type f -iname "$candidate" \
              -not -path './.git/*' \
              -not -path '*/build/*' | head -n 1 || true)"

            if [ -n "$FOUND" ]; then
              ICON_SOURCE="$FOUND"
              break
            fi
          done

          if [ -z "$ICON_SOURCE" ]; then
            echo "ERROR: Launcher icon image was not found."
            echo "Add the intended logo to the repository as 1000170973.png"
            exit 1
          fi

          echo "Using launcher icon: $ICON_SOURCE"

          python3 - "$ICON_SOURCE" "$RES" <<'PY'
          from PIL import Image, ImageOps
          import os
          import sys

          source = sys.argv[1]
          res = sys.argv[2]

          image = Image.open(source).convert("RGBA")
          image = ImageOps.contain(image, (720, 720), Image.Resampling.LANCZOS)

          canvas = Image.new("RGBA", (1024, 1024), (255, 112, 0, 255))
          x = (1024 - image.width) // 2
          y = (1024 - image.height) // 2
          canvas.alpha_composite(image, (x, y))

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }

          for density, size in sizes.items():
              folder = os.path.join(res, f"mipmap-{density}")
              os.makedirs(folder, exist_ok=True)

              icon = canvas.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(os.path.join(folder, "ic_launcher.png"))

              round_icon = icon.copy()
              round_icon.save(os.path.join(folder, "ic_launcher_round.png"))

          adaptive = os.path.join(res, "mipmap-anydpi-v26")
          os.makedirs(adaptive, exist_ok=True)

          with open(os.path.join(adaptive, "ic_launcher.xml"), "w") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>''')

          with open(os.path.join(adaptive, "ic_launcher_round.xml"), "w") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>''')

          colors = os.path.join(res, "values")
          os.makedirs(colors, exist_ok=True)

          with open(os.path.join(colors, "ic_launcher_background.xml"), "w") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#FF7000</color>
          </resources>''')

          foreground = os.path.join(res, "mipmap-anydpi-v26")
          os.makedirs(foreground, exist_ok=True)

          foreground_image = canvas.resize((432, 432), Image.Resampling.LANCZOS)
          foreground_dir = os.path.join(res, "drawable")
          os.makedirs(foreground_dir, exist_ok=True)
          foreground_image.save(os.path.join(foreground_dir, "ic_launcher_foreground.png"))

          print("Launcher icon resources generated.")
          PY

      - name: Fix Android manifest namespace and launcher icon
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="$PROJECT_DIR/app"
          MANIFEST="$APP_DIR/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found: $MANIFEST"
            exit 1
          fi

          python3 - "$MANIFEST" <<'PY'
          import re
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          if not re.search(r'<manifest\b[^>]*>', content):
              raise SystemExit("ERROR: Manifest root element not found.")

          root_match = re.search(r'<manifest\b[^>]*>', content)
          root_tag = root_match.group(0)

          if not re.search(r'xmlns:android\s*=', root_tag):
              root_tag = root_tag[:-1] + ' xmlns:android="http://schemas.android.com/apk/res/android">'
              content = content[:root_match.start()] + root_tag + content[root_match.end():]

          def update_attribute(tag_name, attribute, value):
              global content

              pattern = rf'<{tag_name}\b[^>]*>'

              match = re.search(pattern, content, flags=re.DOTALL)

              if not match:
                  return

              tag = match.group(0)
              attr_pattern = rf'\bandroid:{attribute}\s*=\s*["\'][^"\']*["\']'

              if re.search(attr_pattern, tag):
                  tag = re.sub(
                      attr_pattern,
                      f'android:{attribute}="{value}"',
                      tag
                  )
              else:
                  tag = tag[:-1] + f' android:{attribute}="{value}">'

              content = content[:match.start()] + tag + content[match.end():]

          update_attribute("application", "icon", "@mipmap/ic_launcher")
          update_attribute("application", "roundIcon", "@mipmap/ic_launcher_round")

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)

          try:
              ET.parse(path)
          except ET.ParseError as error:
              raise SystemExit(f"ERROR: Invalid AndroidManifest.xml: {error}")

          print("Manifest XML validated.")
          PY

          echo "Manifest after patch:"
          cat "$MANIFEST"

      - name: Check Android manifests
        shell: bash
        run: |
          set -euo pipefail

          find "$PROJECT_DIR" -path '*/src/*/AndroidManifest.xml' -type f -print

          while IFS= read -r manifest; do
            echo "Checking: $manifest"
            python3 - "$manifest" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]
          ET.parse(path)
          print("Valid XML:", path)
          PY
          done < <(find "$PROJECT_DIR" -path '*/src/*/AndroidManifest.xml' -type f)

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          mkdir -p "$HOME/.android"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/release.keystore"

          echo "KEYSTORE_PATH=$HOME/.android/release.keystore" >> "$GITHUB_ENV"

      - name: Make Gradle executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build signed release APK
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            assembleRelease

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/release/*.apk' | head -n 1 || true)"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          mkdir -p release-output
          cp "$APK" release-output/Kaseb-release.apk

          echo "APK_PATH=release-output/Kaseb-release.apk" >> "$GITHUB_ENV"

          ls -lh release-output/Kaseb-release.apk

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"

          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "$APK_PATH"
          else
            echo "WARNING: apksigner not found; signature verification skipped."
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Kaseb-Android-Release
          path: release-output/Kaseb-release.apk
          if-no-files-found: error
          retention-days: 14
