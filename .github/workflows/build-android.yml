
name: Build Kaseb Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: kaseb-android-release
  cancel-in-progress: false

jobs:
  build-release:
    name: Build Signed Kaseb APK
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Node.js 20
      # --------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --------------------------------------------------
      # 3. Java 21
      # --------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # --------------------------------------------------
      # 4. Extract actual Kaseb source
      # --------------------------------------------------
      - name: Extract Kaseb source
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "source/kaseb-source.zip" ]; then
            mkdir -p "$RUNNER_TEMP/kaseb-source"

            unzip -o "source/kaseb-source.zip" \
              -d "$RUNNER_TEMP/kaseb-source"

            if [ ! -s "$RUNNER_TEMP/kaseb-source/index.html" ]; then
              echo "::error::index.html was not found in source ZIP."
              exit 1
            fi

            cp "$RUNNER_TEMP/kaseb-source/index.html" ./index.html

            echo "Kaseb source extracted successfully."

          elif [ -s "index.html" ]; then
            echo "Using existing index.html."

          else
            echo "::error::Kaseb source ZIP or index.html is missing."
            exit 1
          fi

      # --------------------------------------------------
      # 5. Install Capacitor 7 dependencies
      # --------------------------------------------------
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          npm install --no-audit --no-fund

          echo "Checking Capacitor versions..."

          npm ls @capacitor/core
          npm ls @capacitor/android
          npm ls @capacitor/cli

          mkdir -p www
          cp index.html www/index.html

      # --------------------------------------------------
      # 6. Create Android project
      # --------------------------------------------------
      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ -d android ]; then
            echo "Unexpected pre-existing Android directory."
            echo "This workflow expects a fresh generated Android project."
            exit 1
          fi

          npx cap add android

          npx cap sync android

          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml

          echo "Android project generated successfully."

      # --------------------------------------------------
      # 7. Install Android SDK
      # --------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # --------------------------------------------------
      # 8. Apply Kaseb launcher icons
      # --------------------------------------------------
      - name: Apply Kaseb launcher icons
        shell: bash
        run: |
          set -euo pipefail

          RES="android/app/src/main/res"

          if [ ! -d "resources/android" ]; then
            echo "::error::resources/android directory is missing."
            exit 1
          fi

          test -f "resources/android/mipmap-xxxhdpi/ic_launcher.png"
          test -f "resources/android/mipmap-xxxhdpi/ic_launcher_foreground.png"
          test -f "resources/android/mipmap-anydpi-v26/ic_launcher.xml"

          mkdir -p "$RES"

          cp -a resources/android/. "$RES/"

          echo "Kaseb launcher icons copied."

      # --------------------------------------------------
      # 9. Install native print and backup bridge
      # --------------------------------------------------
      - name: Install Kaseb native bridge
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="resources/native/MainActivity.java"
          TARGET="android/app/src/main/java/com/sevenbox/kaseb/MainActivity.java"

          if [ ! -s "$SOURCE" ]; then
            echo "::error::Kaseb native MainActivity.java is missing."
            exit 1
          fi

          mkdir -p "$(dirname "$TARGET")"

          cp "$SOURCE" "$TARGET"

          grep -q "KasebNative" "$TARGET"

          echo "Native print and backup bridge installed."

      # --------------------------------------------------
      # 10. Safely configure Android Manifest
      # --------------------------------------------------
      - name: Configure Android permissions
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml is missing.")

          ANDROID = "http://schemas.android.com/apk/res/android"

          ET.register_namespace("android", ANDROID)

          tree = ET.parse(manifest)
          root = tree.getroot()

          if root.tag != "manifest":
              raise SystemExit("Invalid manifest root element.")

          application = root.find("application")

          if application is None:
              raise SystemExit("Manifest application element is missing.")

          permission_name = "android.permission.RECORD_AUDIO"

          permission_exists = any(
              element.tag == "uses-permission"
              and element.get(f"{{{ANDROID}}}name") == permission_name
              for element in root
          )

          application_index = list(root).index(application)

          if not permission_exists:
              permission = ET.Element("uses-permission")
              permission.set(f"{{{ANDROID}}}name", permission_name)

              root.insert(application_index, permission)
              application_index += 1

          # Speech recognition service visibility for Android 11+
          queries = root.find("queries")

          if queries is None:
              queries = ET.Element("queries")
              root.insert(application_index, queries)

          action_name = "android.speech.RecognitionService"

          action_exists = any(
              element.tag == "action"
              and element.get(f"{{{ANDROID}}}name") == action_name
              for element in queries.iter()
          )

          if not action_exists:
              intent = ET.SubElement(queries, "intent")
              action = ET.SubElement(intent, "action")
              action.set(f"{{{ANDROID}}}name", action_name)

          tree.write(
              manifest,
              encoding="utf-8",
              xml_declaration=True
          )

          # Parse the final file again to catch XML errors.
          ET.parse(manifest)

          print("Manifest XML is valid.")
          print("Microphone permission configured.")
          print("Speech recognition query configured.")
          PY

          echo "--- Final AndroidManifest.xml ---"
          cat android/app/src/main/AndroidManifest.xml

      # --------------------------------------------------
      # 11. Verify native configuration
      # --------------------------------------------------
      - name: Verify Kaseb Android configuration
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -s "$MANIFEST"
          test -s "android/app/src/main/java/com/sevenbox/kaseb/MainActivity.java"

          grep -q "android.permission.RECORD_AUDIO" "$MANIFEST"

          grep -q "KasebNative" \
            android/app/src/main/java/com/sevenbox/kaseb/MainActivity.java

          grep -rqi "speech-recognition" android/capacitor.settings.gradle

          python3 <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          files = list(Path("android").rglob("AndroidManifest.xml"))

          if not files:
              raise SystemExit("No Android manifests found.")

          for path in files:
              ET.parse(path)
              print("Valid XML:", path)

          print("All Android manifests passed XML validation.")
          PY

      # --------------------------------------------------
      # 12. Configure release signing
      # --------------------------------------------------
      - name: Prepare release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 is missing."
            exit 1
          fi

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "${KEY_ALIAS:-}" ]; then
            echo "::error::KEY_ALIAS is missing."
            exit 1
          fi

          if [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::KEY_PASSWORD is missing."
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/kaseb-release.jks"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"

          test -s "$KEYSTORE"

          echo "KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

          echo "Release keystore prepared."

      # --------------------------------------------------
      # 13. Build signed release APK
      # --------------------------------------------------
      - name: Build signed release APK
        shell: bash
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/kaseb-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd android

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            assembleRelease

      # --------------------------------------------------
      # 14. Locate APK
      # --------------------------------------------------
      - name: Collect release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find android/app/build/outputs/apk/release \
            -type f -name '*.apk' | head -n 1 || true)"

          if [ -z "$APK" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          mkdir -p release-output

          cp "$APK" release-output/Kaseb-release.apk

          test -s release-output/Kaseb-release.apk

          ls -lh release-output/Kaseb-release.apk

      # --------------------------------------------------
      # 15. Verify APK signature
      # --------------------------------------------------
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner is missing."
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs \
            release-output/Kaseb-release.apk

      # --------------------------------------------------
      # 16. Upload APK artifact
      # --------------------------------------------------
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: kaseb-android-release
          path: release-output/Kaseb-release.apk
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------
      # 17. Attach APK to GitHub Release
      # --------------------------------------------------
      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/Kaseb-release.apk
          generate_release_notes: true
