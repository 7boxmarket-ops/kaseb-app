
name: Kaseb Android Release APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Locate and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted

          ZIP_PATH="$(find . -type f -iname '*.zip' \
            ! -path './.git/*' \
            ! -path './extracted/*' \
            -print -quit)"

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::Project ZIP not found."
            exit 1
          fi

          echo "Project ZIP: $ZIP_PATH"
          unzip -q "$ZIP_PATH" -d extracted

          GRADLEW="$(find extracted -type f -name gradlew \
            ! -path '*/node_modules/*' \
            -print -quit)"

          if [ -n "$GRADLEW" ]; then
            PROJECT_DIR="$(cd "$(dirname "$GRADLEW")" && pwd)"
            APP_DIR="$PROJECT_DIR/app"
            echo "Existing Android project detected."
          else
            INDEX_HTML="$(find extracted -type f -name index.html \
              ! -path '*/node_modules/*' \
              ! -path '*/.git/*' \
              -print -quit)"

            if [ -z "$INDEX_HTML" ]; then
              echo "::error::index.html not found."
              exit 1
            fi

            WEB_DIR="$(dirname "$INDEX_HTML")"

            mkdir -p android-wrapper/www
            cp -a "$WEB_DIR"/. android-wrapper/www/

            cd android-wrapper
            npm init -y
            npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

            npx cap init "کاسب" com.sevenbox.kaseb --web-dir=www
            npx cap add android

            PROJECT_DIR="$GITHUB_WORKSPACE/android-wrapper/android"
            APP_DIR="$PROJECT_DIR/app"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager \
            -print 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Generate Android launcher icons
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install --quiet Pillow

          export APP_DIR

          python3 - <<'PY'
          import os
          import zipfile
          import tempfile
          from pathlib import Path
          from PIL import Image

          root = Path("extracted")
          app = Path(os.environ["APP_DIR"])
          temp = Path(tempfile.mkdtemp())

          extensions = {".png", ".jpg", ".jpeg", ".webp"}
          candidates = []

          def add_image(path):
              try:
                  with Image.open(path) as im:
                      im.verify()
                  candidates.append(Path(path))
              except Exception:
                  pass

          # Search images in the extracted project.
          for path in root.rglob("*"):
              if path.is_file() and path.suffix.lower() in extensions:
                  if "node_modules" not in path.parts:
                      add_image(path)

          # Search images inside nested ZIP files.
          for archive in root.rglob("*.zip"):
              try:
                  with zipfile.ZipFile(archive) as z:
                      for info in z.infolist():
                          if Path(info.filename).suffix.lower() not in extensions:
                              continue

                          if info.file_size > 20 * 1024 * 1024:
                              continue

                          target = temp / (
                              str(len(candidates)) +
                              Path(info.filename).suffix.lower()
                          )

                          with z.open(info) as src:
                              target.write_bytes(src.read())

                          add_image(target)

              except Exception as error:
                  print("Nested ZIP skipped:", error)

          if not candidates:
              raise SystemExit("No valid images found in project ZIP.")

          # Prefer icon/logo images and square, sufficiently large images.
          def score(path):
              name = str(path).lower()
              value = 0

              if "icon" in name:
                  value += 100
              if "logo" in name:
                  value += 80
              if "kaseb" in name:
                  value += 50

              try:
                  with Image.open(path) as im:
                      width, height = im.size
                      if width and height:
                          value += int(
                              min(width, height) /
                              max(width, height) * 30
                          )
                      if width >= 256 and height >= 256:
                          value += 20
              except Exception:
                  return -1

              return value

          candidates.sort(key=score, reverse=True)

          # Explicitly report candidates for verification.
          for path in candidates[:10]:
              print("IMAGE CANDIDATE:", path, score(path))

          selected = candidates[0]
          print("SELECTED ICON:", selected)

          with Image.open(selected) as im:
              logo = im.convert("RGBA")

          res = app / "src/main/res"

          # Legacy launcher icons.
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, size in sizes.items():
              directory = res / folder
              directory.mkdir(parents=True, exist_ok=True)

              canvas = Image.new(
                  "RGBA", (size, size), "#FF7000"
              )

              icon = logo.copy()
              icon.thumbnail(
                  (int(size * 0.82), int(size * 0.82)),
                  Image.Resampling.LANCZOS
              )

              canvas.alpha_composite(
                  icon,
                  (
                      (size - icon.width) // 2,
                      (size - icon.height) // 2
                  )
              )

              canvas.save(
                  directory / "ic_launcher.png",
                  optimize=True
              )
              canvas.save(
                  directory / "ic_launcher_round.png",
                  optimize=True
              )

          # Adaptive icon foreground.
          directory = res / "drawable"
          directory.mkdir(parents=True, exist_ok=True)

          foreground = Image.new(
              "RGBA", (432, 432), (0, 0, 0, 0)
          )

          icon = logo.copy()
          icon.thumbnail(
              (280, 280),
              Image.Resampling.LANCZOS
          )

          foreground.alpha_composite(
              icon,
              (
                  (432 - icon.width) // 2,
                  (432 - icon.height) // 2
              )
          )

          foreground.save(
              directory / "ic_launcher_foreground.png",
              optimize=True
          )

          # Adaptive icon background.
          directory = res / "values"
          directory.mkdir(parents=True, exist_ok=True)

          (directory / "ic_launcher_background.xml").write_text(
              '<resources><color name="ic_launcher_background">'
              '#FF7000</color></resources>',
              encoding="utf-8"
          )

          directory = res / "mipmap-anydpi-v26"
          directory.mkdir(parents=True, exist_ok=True)

          adaptive = '''<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>'''

          for filename in (
              "ic_launcher.xml",
              "ic_launcher_round.xml"
          ):
              (directory / filename).write_text(
                  adaptive,
                  encoding="utf-8"
              )

          print("Launcher icons generated successfully.")
          PY

      - name: Configure Android manifest
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="$APP_DIR/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "::error::AndroidManifest.xml not found."
            exit 1
          fi

          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]
          tree = ET.parse(path)
          root = tree.getroot()

          android = "{http://schemas.android.com/apk/res/android}"

          root.set(android + "icon", "@mipmap/ic_launcher")
          root.set(android + "roundIcon", "@mipmap/ic_launcher_round")

          tree.write(
              path,
              encoding="utf-8",
              xml_declaration=True
          )

          print("Android manifest updated.")
          PY

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ] || \
             [ -z "$KEYSTORE_PASSWORD" ] || \
             [ -z "$KEY_ALIAS" ] || \
             [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are missing."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/kaseb-release.jks"

          printf '%s' "$KEYSTORE_BASE64" |
            base64 --decode > "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" >/dev/null

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed Release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"
          chmod +x ./gradlew

          ./gradlew --no-daemon clean assembleRelease \
            "-Pandroid.injected.signing.store.file=$KEYSTORE_PATH" \
            "-Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$KEY_PASSWORD"

      - name: Verify and collect APK
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/release/*.apk' \
            -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK not found."
            exit 1
          fi

          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"

          "$APKSIGNER" verify --verbose "$APK_PATH"

          mkdir -p apk-output

          cp "$APK_PATH" apk-output/Kaseb-Release.apk

          ls -lh apk-output/Kaseb-Release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Kaseb-Android-Release
          path: apk-output/Kaseb-Release.apk
          if-no-files-found: error
          retention-days: 30
